name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude PR Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Проаналізуй лише зміни в цьому pull request.

            Знайди:
            - потенційні баги;
            - проблеми з іменуванням;
            - відсутню обробку помилок;
            - edge cases, які не покриті тестами.

            Для кожного зауваження вкажи рівень:
            CRITICAL, HIGH, MEDIUM або LOW.

            Посилайся на конкретні файли та рядки.
            Не змінюй код.
            Залиш результат як коментар у pull request.

      - name: Show Claude execution output
        if: always()
        shell: bash
        run: |
          echo "Searching for Claude execution output..."

          find "${RUNNER_TEMP}" -name "claude-execution-output.json" \
            -type f -print -exec cat {} \; || true
